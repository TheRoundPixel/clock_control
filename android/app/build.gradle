plugins {
    id 'com.android.application'
}

android {
    namespace 'ru.relaytimer'
    compileSdk 34

    defaultConfig {
        applicationId 'ru.relaytimer'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // Постоянный ключ подписи: новые сборки ставятся поверх старых без удаления приложения
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
